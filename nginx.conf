worker_processes auto;

events {
    worker_connections 1024;
}

http {
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;

        # ① 反代你的前端页面（华夏小课堂）
        location / {
            proxy_pass https://huaxia-tech.github.io;
            proxy_set_header Host huaxia-tech.github.io;
        }

        # ② 反代 Umami 的 script.js
        location /script.js {
            proxy_pass https://umami-production-08d5.up.railway.app/script.js;
        }

        # ③ 反代 Umami 的 API
        location /api/ {
            proxy_pass https://umami-production-08d5.up.railway.app/api/;
        }

        # ④ 反代 Umami 的后台页面
        location /websites/ {
            proxy_pass https://umami-production-08d5.up.railway.app/websites/;
        }

        location /dashboard {
            proxy_pass https://umami-production-08d5.up.railway.app/dashboard;
        }
    }
}

